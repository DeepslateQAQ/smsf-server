# smsf-server 单服务部署。
#
#   docker compose up -d --build
#   docker compose logs -f smsf
#
# 数据落在仓库根的 ./data（容器内 /app/data），直接备份这个目录即可。

services:
  smsf:
    container_name: smsf-server
    build:
      context: .
      dockerfile: Dockerfile
    image: smsf-server:latest
    restart: unless-stopped
    # 可选：若仓库根存在 .env 就加载（不存在也不报错）。
    # environment 的优先级高于 env_file，因此下面的 SMSF_DATABASE_URL 始终以
    # 容器内的绝对路径 /app/data/smsf.sqlite3 为准。
    env_file:
      - path: .env
        required: false
    ports:
      - "8801:8801"
    environment:
      # 4 个斜杠 = 绝对路径 /app/data/smsf.sqlite3
      SMSF_DATABASE_URL: "sqlite+pysqlite:////app/data/smsf.sqlite3"
      SMSF_AUTO_MIGRATE: "true"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import sys, urllib.request;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8801/api/health', timeout=3).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
